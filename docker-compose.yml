# Aimlake Open Telematics — local stack (expand as services are implemented)
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: aimlake
      POSTGRES_PASSWORD: aimlake
      POSTGRES_DB: aimlake_telematics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8
    ports:
      - "6379:6379"

  # api:
  #   build: ./apps/api
  #   depends_on: [postgres, valkey]
  # worker:
  #   build: ./apps/worker
  #   depends_on: [postgres, valkey]

volumes:
  pgdata:
